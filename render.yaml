# Render Blueprint for NeuroTriage-Home.
#
# Deploys three services from one repo:
#   1. neurotriage-api       Flask backend (web service, gunicorn)
#   2. neurotriage-frontend  React/Vite build (static site) that forwards
#                            /api/* to the API via a rewrite rule, so the
#                            frontend's relative fetch('/api/...') calls
#                            work unchanged and there are no CORS issues
#   3. neurotriage-workflow  Render Workflow demo ("Best Use of Render" track)
#
# Setup:
#   1. Push this file to GitHub.
#   2. Render dashboard: New -> Blueprint -> select this repo.
#   3. Fill in the secrets marked `sync: false` when prompted (see below).
#   4. After first deploy, check the API's real URL in the dashboard. If it
#      is not https://neurotriage-api.onrender.com (name already taken),
#      update the /api/* rewrite destination below and redeploy the frontend.
#   5. In Supabase: Authentication -> URL Configuration -> set Site URL to
#      the frontend's Render URL, so email-confirmation links land there.
#
# Confirm key names against Render's current Blueprint docs before deploying.

services:
  - type: web
    name: neurotriage-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    # One worker on purpose: PENDING_CHECKINS in app.py is an in-process
    # dict, so face -> voice -> submit must all hit the same process.
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Local-only demo identities (see backend/auth.py). Must stay off in production.
      - key: ALLOW_DEMO_AUTH
        value: "0"
      # Creates already-confirmed accounts server-side (POST /api/signup) because
      # Supabase's built-in email sender is rate-limited. Emails are UNVERIFIED.
      # Remove this and VITE_AUTO_CONFIRM_SIGNUP to use normal email confirmation.
      - key: ALLOW_AUTO_CONFIRM_SIGNUP
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY   # service_role key (server-only, never the anon key)
        sync: false

  - type: web
    name: neurotriage-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Inlined into the browser bundle at build time (anon key is safe to expose).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AUTO_CONFIRM_SIGNUP
        value: "1"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://neurotriage-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: workflow
    name: neurotriage-workflow
    runtime: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/workflow.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
